<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake Bot · Dashboard en vivo</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07100c; --surface: #101d17; --surface-2: #16271e;
      --line: #294236; --text: #ecf9f0; --muted: #91aa9b;
      --a: #64f58d; --a-body: #258d49; --b: #68b7ff;
      --b-body: #286492; --food: #ffca55; --danger: #ff7474;
      --card-min: 280px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% -20%, #193d2b 0, var(--bg) 45%); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    main { width: min(1920px, calc(100% - 24px)); margin: auto; padding: 18px 0 32px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
    h1 { margin: 0; font-size: clamp(20px, 2.4vw, 32px); letter-spacing: -.03em; }
    .connection { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 7px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 10px currentColor; }
    .dot.online { background: var(--a); }
    .toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    .filters { display: flex; gap: 6px; flex-wrap: wrap; }
    button, select { border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--text); padding: 7px 10px; font: inherit; font-size: 12px; cursor: pointer; }
    button:hover, button.active { border-color: var(--a); }
    .dashboard {
      --status-size: clamp(15px, 1.25vw, 22px); --score-size: clamp(18px, 1.45vw, 26px);
      --moves-size: clamp(19px, 1.55vw, 28px); --identity-size: clamp(12px, .85vw, 15px);
      --direction-size: clamp(12px, .9vw, 15px); --board-max: 100%;
      display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--card-min)), 1fr)); gap: 12px; align-items: start;
    }
    .dashboard.density-one { --card-min: min(720px, 100%); --status-size: clamp(24px, 3vw, 38px); --score-size: clamp(27px, 3.3vw, 42px); --moves-size: clamp(29px, 3.6vw, 46px); --identity-size: clamp(16px, 1.55vw, 21px); --direction-size: clamp(16px, 1.5vw, 21px); --board-max: min(43vh, 420px); max-width: 980px; margin: auto; }
    .dashboard.density-low { --card-min: 360px; --status-size: clamp(20px, 2vw, 29px); --score-size: clamp(24px, 2.35vw, 34px); --moves-size: clamp(25px, 2.55vw, 36px); --identity-size: clamp(14px, 1.2vw, 17px); --direction-size: clamp(14px, 1.2vw, 17px); --board-max: 360px; }
    .dashboard.density-medium { --card-min: 245px; --status-size: clamp(17px, 1.45vw, 23px); --score-size: clamp(21px, 1.75vw, 28px); --moves-size: clamp(22px, 1.9vw, 30px); --identity-size: clamp(12px, .95vw, 15px); --direction-size: clamp(13px, 1vw, 16px); }
    .dashboard.density-high { --card-min: 180px; --status-size: clamp(14px, 1.05vw, 18px); --score-size: clamp(18px, 1.25vw, 22px); --moves-size: clamp(19px, 1.35vw, 23px); --identity-size: clamp(11px, .75vw, 13px); --direction-size: clamp(12px, .8vw, 14px); gap: 8px; }
    .dashboard.density-ultra { --card-min: 150px; --status-size: clamp(13px, .9vw, 16px); --score-size: clamp(17px, 1.05vw, 20px); --moves-size: clamp(18px, 1.15vw, 22px); --identity-size: clamp(10px, .68vw, 12px); --direction-size: clamp(11px, .72vw, 13px); gap: 5px; }
    .game-card { min-width: 0; border: 1px solid var(--line); border-radius: 13px; padding: 10px; background: color-mix(in srgb, var(--surface) 96%, transparent); cursor: pointer; content-visibility: auto; contain-intrinsic-size: 220px; }
    .game-card:hover { border-color: var(--muted); transform: translateY(-1px); }
    .game-card.finished { opacity: .88; }
    .game-card.win { border-color: color-mix(in srgb, var(--a) 60%, var(--line)); }
    .game-card.loss { border-color: color-mix(in srgb, var(--danger) 60%, var(--line)); }
    .card-head, .card-line { display: flex; justify-content: space-between; gap: 7px; align-items: center; min-width: 0; }
    .opponent { font-weight: 750; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .game-id, .meta { color: var(--muted); font-size: 11px; }
    .standing { margin: 7px 0 6px; font-size: var(--status-size); line-height: 1.05; font-weight: 950; letter-spacing: .055em; text-shadow: 0 0 14px color-mix(in srgb, currentColor 28%, transparent); }
    .standing.leading { color: var(--a); } .standing.tied { color: var(--food); } .standing.trailing { color: var(--danger); }
    .scores { display: grid; gap: 2px; margin-bottom: 5px; }
    .score-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: var(--identity-size); }
    .score-owner { min-width: 0; display: flex; align-items: center; gap: 6px; overflow: hidden; white-space: nowrap; color: var(--text); font-weight: 800; }
    .score-owner-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .side-dot { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 6px currentColor; }
    .side-dot.side-a { color: var(--a); background: var(--a); }
    .side-dot.side-b { color: var(--b); background: var(--b); }
    .score-value { font: 900 var(--score-size)/1 ui-monospace, monospace; color: var(--text); }
    .moves { display: flex; align-items: center; justify-content: space-between; gap: 7px; margin: 7px 0; padding: 7px 9px; border-radius: 8px; background: var(--surface-2); font-size: var(--identity-size); font-weight: 850; letter-spacing: .035em; }
    .moves strong { font: 950 var(--moves-size)/1 ui-monospace, monospace; color: var(--food); }
    .badge { border-radius: 999px; padding: 2px 6px; font-size: 9px; font-weight: 800; letter-spacing: .04em; background: var(--surface-2); white-space: nowrap; }
    .badge.normal { color: var(--a); } .badge.busy { color: var(--food); } .badge.critical { color: var(--danger); }
    .board { display: block; width: min(100%, var(--board-max)); aspect-ratio: 1; margin: 8px auto; border-radius: 7px; background: #0b1711; image-rendering: pixelated; }
    .last { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--direction-size); text-transform: uppercase; font-weight: 850; }
    .result { font-weight: 800; } .result.win { color: var(--a); } .result.loss { color: var(--danger); } .result.draw { color: var(--food); }
    .empty { min-height: 55vh; display: grid; place-items: center; text-align: center; color: var(--muted); }
    .hidden { display: none !important; }
    dialog { width: min(1050px, calc(100% - 24px)); max-height: calc(100vh - 24px); padding: 0; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--text); }
    dialog::backdrop { background: rgba(0, 0, 0, .76); backdrop-filter: blur(3px); }
    .detail-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .detail-layout { display: grid; grid-template-columns: minmax(300px, 2fr) minmax(240px, 1fr); gap: 16px; padding: 16px; overflow: auto; }
    #detailBoard { width: 100%; aspect-ratio: 1; border-radius: 10px; background: #0b1711; }
    .detail-list { display: grid; align-content: start; gap: 10px; }
    .detail-row { display: flex; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
    .detail-row span:first-child { color: var(--muted); }
    .detail-identity { display: inline-flex; align-items: center; justify-content: flex-end; gap: 7px; text-align: right; }
    @media (max-width: 720px) { main { width: calc(100% - 14px); } header { align-items: flex-start; flex-direction: column; } .detail-layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Snake Bot <span style="color:var(--muted);font-weight:500">/ dashboard</span></h1>
      <div class="connection"><span id="dot" class="dot"></span><span id="connection">Conectando…</span> · <span id="gameCount">0 partidas</span></div>
    </header>
    <div class="toolbar">
      <div id="statusFilters" class="filters" aria-label="Filtrar por estado">
        <button class="active" data-status="all">Todas</button><button data-status="active">Activas</button><button data-status="finished">Finalizadas</button>
      </div>
      <select id="resultFilter" aria-label="Filtrar por resultado"><option value="all">Todos los resultados</option><option value="win">Victorias</option><option value="loss">Derrotas</option><option value="draw">Empates</option></select>
    </div>
    <div id="empty" class="empty">Esperando el comienzo de una partida…</div>
    <section id="dashboard" class="dashboard hidden" aria-label="Partidas simultáneas"></section>
  </main>

  <dialog id="detailDialog">
    <div class="detail-head"><strong id="detailTitle">Partida</strong><button id="closeDetail" type="button">Cerrar</button></div>
    <div class="detail-layout">
      <canvas id="detailBoard" aria-label="Tablero ampliado"></canvas>
      <div id="detailInfo" class="detail-list"></div>
    </div>
  </dialog>

  <script>
    const games = new Map();
    const dashboard = document.getElementById('dashboard');
    const empty = document.getElementById('empty');
    const dialog = document.getElementById('detailDialog');
    const directionLabels = { up: '↑ ARRIBA', down: '↓ ABAJO', left: '← IZQUIERDA', right: '→ DERECHA' };
    const cssColor = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    const colors = { ' ': '#0b1711', A: cssColor('--a'), a: cssColor('--a-body'), B: cssColor('--b'), b: cssColor('--b-body'), '*': cssColor('--food') };
    let statusFilter = 'all';
    let resultFilter = 'all';
    let detailGameId = null;
    let pendingPayload = null;
    let renderTimer = null;
    const RENDER_INTERVAL_MS = 100;

    function parseBoard(raw) {
      return (raw || '').split(/\r?\n/).filter(Boolean).map(row => {
        const first = row.indexOf('|'), last = row.lastIndexOf('|');
        return first >= 0 && last > first ? row.slice(first + 1, last) : row;
      });
    }

    function drawBoard(canvas, raw) {
      const rows = parseBoard(raw);
      if (!rows.length) return;
      const size = Math.max(120, Math.round(canvas.clientWidth * (window.devicePixelRatio || 1)));
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const cellW = size / rows[0].length, cellH = size / rows.length;
      ctx.fillStyle = colors[' ']; ctx.fillRect(0, 0, size, size);
      rows.forEach((row, r) => [...row].forEach((symbol, c) => {
        ctx.fillStyle = colors[symbol] || colors[' '];
        const pad = symbol === ' ' ? 0 : Math.max(1, size * .0018);
        if (symbol === '*') {
          ctx.beginPath(); ctx.arc((c + .5) * cellW, (r + .5) * cellH, Math.min(cellW, cellH) * .28, 0, Math.PI * 2); ctx.fill();
        } else ctx.fillRect(c * cellW + pad, r * cellH + pad, cellW - pad * 2, cellH - pad * 2);
      }));
    }

    function opponent(state) { return state.side === 'A' ? state.player_2 : state.player_1; }
    function ownPlayer(state) { return state.side === 'B' ? state.player_2 : state.player_1; }
    function rivalSide(state) { return state.side === 'A' ? 'B' : 'A'; }
    function ownScore(state) { return state.side === 'B' ? (state.score_2 ?? 0) : (state.score_1 ?? 0); }
    function rivalScore(state) { return state.side === 'B' ? (state.score_1 ?? 0) : (state.score_2 ?? 0); }
    function isSelfChallenge(state) { return Boolean(state.player_1 && state.player_1 === state.player_2); }
    function ownLabel(state) { return isSelfChallenge(state) ? 'MI BOT' : `YO · ${ownPlayer(state) || 'Mi bot'}`; }
    function rivalLabel(state) { return isSelfChallenge(state) ? 'MI BOT' : `RIVAL · ${opponent(state) || 'Desconocido'}`; }
    function rivalHeading(state) { return isSelfChallenge(state) ? `Mi bot (${rivalSide(state)})` : (opponent(state) || 'Rival'); }
    function sideClass(side) { return side === 'B' ? 'side-b' : 'side-a'; }
    function standing(state) {
      if (ownScore(state) > rivalScore(state)) return { label: 'GANANDO', className: 'leading' };
      if (ownScore(state) < rivalScore(state)) return { label: 'PERDIENDO', className: 'trailing' };
      return { label: 'EMPATE', className: 'tied' };
    }
    function result(state) {
      if (state.status !== 'finished') return 'active';
      if (ownScore(state) > rivalScore(state)) return 'win';
      if (ownScore(state) < rivalScore(state)) return 'loss';
      return 'draw';
    }
    function resultLabel(value) { return { win: 'VICTORIA', loss: 'DERROTA', draw: 'EMPATE', active: 'EN JUEGO' }[value]; }
    function shortId(id) { return String(id || '—').slice(0, 10); }
    function escapeHtml(value) {
      return String(value ?? '—').replace(/[&<>"']/g, symbol => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[symbol]);
    }

    function visibleStates() {
      return [...games.values()].filter(state => {
        const stateResult = result(state);
        if (statusFilter === 'active' && stateResult !== 'active') return false;
        if (statusFilter === 'finished' && stateResult === 'active') return false;
        return resultFilter === 'all' || stateResult === resultFilter;
      }).sort((a, b) => Number(a.status === 'finished') - Number(b.status === 'finished'));
    }

    function density(count) {
      if (count <= 1) return 'density-one';
      if (count <= 4) return 'density-low';
      if (count <= 16) return 'density-medium';
      if (count <= 70) return 'density-high';
      return 'density-ultra';
    }

    function makeCard(state) {
      const outcome = result(state);
      const card = document.createElement('article');
      card.className = `game-card ${state.status === 'finished' ? 'finished' : ''} ${outcome}`;
      card.dataset.gameId = state.game_id;
      card.tabIndex = 0;
      const level = ['normal', 'busy', 'critical'].includes(state.compute_level) ? state.compute_level : 'normal';
      const position = standing(state);
      card.innerHTML = `
        <div class="card-head"><span class="opponent">vs ${escapeHtml(rivalHeading(state))}</span><span class="badge">BOT ${escapeHtml(state.side)}</span></div>
        <div class="standing ${position.className}">${state.status === 'finished' ? resultLabel(outcome) : position.label}</div>
        <div class="scores">
          <div class="score-row own-score"><span class="score-owner"><i aria-hidden="true" class="side-dot ${sideClass(state.side)}"></i><span class="score-owner-text">${escapeHtml(ownLabel(state))} · ${escapeHtml(state.side)}</span></span><strong class="score-value">${escapeHtml(ownScore(state))}</strong></div>
          <div class="score-row rival-score"><span class="score-owner"><i aria-hidden="true" class="side-dot ${sideClass(rivalSide(state))}"></i><span class="score-owner-text">${escapeHtml(rivalLabel(state))} · ${rivalSide(state)}</span></span><strong class="score-value">${escapeHtml(rivalScore(state))}</strong></div>
        </div>
        <div class="moves"><span>MOVIMIENTOS</span><strong>${escapeHtml(state.remaining_moves)}</strong></div>
        <canvas class="board" aria-label="Tablero ${escapeHtml(shortId(state.game_id))}"></canvas>
        <div class="card-line"><span class="last">${escapeHtml(directionLabels[state.direction] || state.direction || 'SIN JUGADA')}</span><span class="meta">${escapeHtml(state.mode || 'balanced')}</span></div>
        <div class="card-line game-id"><span>${escapeHtml(shortId(state.game_id))}</span><span class="meta"><span class="badge ${level}">${level.toUpperCase()}</span> ${state.decision_ms == null ? '—' : escapeHtml(Number(state.decision_ms).toFixed(1) + ' ms')}</span></div>`;
      const open = () => openDetail(state.game_id);
      card.onclick = open;
      card.onkeydown = event => { if (event.key === 'Enter' || event.key === ' ') open(); };
      return card;
    }

    function renderDashboard() {
      const states = visibleStates();
      dashboard.className = `dashboard ${density(states.length)} ${states.length ? '' : 'hidden'}`;
      empty.classList.toggle('hidden', states.length > 0);
      empty.textContent = games.size ? 'No hay partidas para este filtro.' : 'Esperando el comienzo de una partida…';
      const fragment = document.createDocumentFragment();
      states.forEach(state => fragment.appendChild(makeCard(state)));
      dashboard.replaceChildren(fragment);
      dashboard.querySelectorAll('.game-card').forEach(card => drawBoard(card.querySelector('canvas'), games.get(card.dataset.gameId)?.board));
      const active = [...games.values()].filter(state => state.status !== 'finished').length;
      document.getElementById('gameCount').textContent = `${active} activa${active === 1 ? '' : 's'} / ${games.size} total`;
      if (detailGameId && games.has(detailGameId)) renderDetail(games.get(detailGameId));
    }

    function detailRow(label, value) { return `<div class="detail-row"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>`; }
    function detailIdentityRow(label, name, side) { return `<div class="detail-row"><span>${escapeHtml(label)}</span><strong class="detail-identity"><i aria-hidden="true" class="side-dot ${sideClass(side)}"></i>${escapeHtml(name)} · ${escapeHtml(side)}</strong></div>`; }
    function renderDetail(state) {
      const outcome = result(state);
      document.getElementById('detailTitle').textContent = `${shortId(state.game_id)} · vs ${opponent(state) || 'Rival'}`;
      document.getElementById('detailInfo').innerHTML = [
        detailRow('Game ID', state.game_id), detailRow('Estado', resultLabel(outcome)),
        detailIdentityRow('Mi bot', ownPlayer(state) || '—', state.side),
        detailIdentityRow('Rival', opponent(state) || '—', rivalSide(state)),
        detailRow('Jugador A', `${state.player_1 || '—'} · ${state.score_1 ?? 0}`),
        detailRow('Jugador B', `${state.player_2 || '—'} · ${state.score_2 ?? 0}`),
        detailRow('Lado del bot', state.side), detailRow('Rival', opponent(state)),
        detailRow('Movimientos restantes', state.remaining_moves),
        detailRow('Última jugada', directionLabels[state.direction] || state.direction),
        detailRow('Modo estratégico', state.mode), detailRow('Compute level', state.compute_level),
        detailRow('Tiempo de decisión', state.decision_ms == null ? null : Number(state.decision_ms).toFixed(2) + ' ms'),
        detailRow('Decisiones pendientes', state.pending_decisions), detailRow('Ganador informado', state.winner)
      ].join('');
      requestAnimationFrame(() => drawBoard(document.getElementById('detailBoard'), state.board || state.final_board));
    }
    function openDetail(gameId) { detailGameId = gameId; renderDetail(games.get(gameId)); dialog.showModal(); }
    document.getElementById('closeDetail').onclick = () => dialog.close();
    dialog.addEventListener('close', () => { detailGameId = null; });
    dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); });

    function applyPayload(payload) {
      const incoming = new Set();
      (payload.games || []).forEach(state => { const id = String(state.game_id); incoming.add(id); games.set(id, state); });
      [...games.keys()].forEach(id => { if (!incoming.has(id)) games.delete(id); });
      renderDashboard();
    }
    function schedulePayload(payload) {
      pendingPayload = payload;
      if (renderTimer !== null) return;
      renderTimer = setTimeout(() => {
        const latest = pendingPayload; pendingPayload = null; renderTimer = null;
        requestAnimationFrame(() => applyPayload(latest));
      }, RENDER_INTERVAL_MS);
    }

    document.getElementById('statusFilters').onclick = event => {
      const button = event.target.closest('button[data-status]'); if (!button) return;
      statusFilter = button.dataset.status;
      document.querySelectorAll('[data-status]').forEach(item => item.classList.toggle('active', item === button));
      renderDashboard();
    };
    document.getElementById('resultFilter').onchange = event => { resultFilter = event.target.value; renderDashboard(); };
    window.addEventListener('resize', () => { if (detailGameId) renderDetail(games.get(detailGameId)); });

    const events = new EventSource('/events');
    events.onopen = () => { document.getElementById('dot').classList.add('online'); document.getElementById('connection').textContent = 'Conectado'; };
    events.onerror = () => { document.getElementById('dot').classList.remove('online'); document.getElementById('connection').textContent = 'Reconectando…'; };
    events.onmessage = event => schedulePayload(JSON.parse(event.data));
  </script>
</body>
</html>
