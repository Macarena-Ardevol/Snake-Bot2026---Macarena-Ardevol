<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake Bot · Partida en vivo</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08110d;
      --surface: #101d17;
      --line: #294236;
      --text: #ecf9f0;
      --muted: #91aa9b;
      --a: #64f58d;
      --a-body: #258d49;
      --b: #68b7ff;
      --b-body: #286492;
      --food: #ffca55;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 50% -20%, #193d2b 0, var(--bg) 45%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
    }

    main { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 40px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    h1 { margin: 0; font-size: clamp(22px, 3vw, 34px); letter-spacing: -.03em; }
    .connection { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #ef6262; box-shadow: 0 0 12px currentColor; }
    .dot.online { background: var(--a); }
    .game-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 14px; margin-bottom: 8px; scrollbar-width: thin; }
    .game-tab { flex: 0 0 auto; display: grid; grid-template-columns: 8px auto; column-gap: 8px; align-items: center; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text); cursor: pointer; font: inherit; }
    .game-tab:hover { border-color: var(--muted); }
    .game-tab.active { border-color: var(--a); box-shadow: inset 0 0 0 1px var(--a); }
    .game-tab-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--a); }
    .game-tab-dot.finished { background: var(--muted); }
    .game-tab-name { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; }
    .game-tab-score { grid-column: 2; color: var(--muted); font-size: 12px; text-align: left; }

    .layout { display: grid; grid-template-columns: minmax(300px, 680px) minmax(230px, 1fr); gap: 22px; align-items: start; }
    .panel { border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 94%, transparent); border-radius: 18px; }
    .board-panel { padding: 16px; }
    #board { display: grid; aspect-ratio: 1; width: 100%; gap: 2px; padding: 2px; border-radius: 10px; background: #20392d; overflow: hidden; }
    .cell { display: grid; place-items: center; min-width: 0; border-radius: 2px; background: #0b1711; }
    .cell.a-head, .cell.b-head { border-radius: 35%; box-shadow: inset 0 0 0 2px rgba(255,255,255,.38), 0 0 10px currentColor; }
    .cell.a-head { background: var(--a); color: var(--a); }
    .cell.a-body { background: var(--a-body); }
    .cell.b-head { background: var(--b); color: var(--b); }
    .cell.b-body { background: var(--b-body); }
    .cell.food::after { content: ""; width: 58%; height: 58%; border-radius: 50%; background: var(--food); box-shadow: 0 0 12px rgba(255,202,85,.7); }

    aside { display: grid; gap: 14px; }
    .score { padding: 18px; }
    .player { display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: center; padding: 12px 0; }
    .player + .player { border-top: 1px solid var(--line); }
    .swatch { width: 10px; height: 32px; border-radius: 6px; }
    .swatch.a { background: var(--a); } .swatch.b { background: var(--b); }
    .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; }
    .side { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .points { font: 700 24px ui-monospace, SFMono-Regular, monospace; }
    .details { padding: 18px; display: grid; gap: 14px; }
    .detail { display: flex; justify-content: space-between; gap: 12px; }
    .label { color: var(--muted); }
    .value { text-align: right; font-weight: 650; }
    #status { color: var(--food); }

    .empty { min-height: 400px; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 30px; }
    .winner { margin-top: 14px; padding: 16px 18px; color: var(--food); font-weight: 700; text-align: center; }
    .hidden { display: none; }

    @media (max-width: 780px) {
      .layout { grid-template-columns: 1fr; }
      aside { grid-template-columns: 1fr 1fr; }
      .winner { grid-column: 1 / -1; }
    }

    @media (max-width: 520px) {
      main { width: min(100% - 20px, 1120px); padding-top: 18px; }
      header { align-items: flex-start; flex-direction: column; }
      aside { grid-template-columns: 1fr; }
      .winner { grid-column: auto; }
      .board-panel { padding: 9px; border-radius: 13px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Snake Bot <span style="color:var(--muted);font-weight:500">/ en vivo</span></h1>
      <div class="connection"><span id="dot" class="dot"></span><span id="connection">Conectando…</span> · <span id="gameCount">0 partidas</span></div>
    </header>

    <nav id="gameTabs" class="game-tabs hidden" aria-label="Partidas simultáneas"></nav>

    <section class="layout">
      <div class="panel board-panel">
        <div id="empty" class="empty">Esperando el comienzo de una partida…</div>
        <div id="board" class="hidden" role="grid" aria-label="Tablero de Snake"></div>
      </div>

      <aside>
        <div class="panel score">
          <div class="player"><span class="swatch a"></span><div><div id="player1" class="name">Jugador A</div><div class="side">Serpiente A</div></div><div id="score1" class="points">0</div></div>
          <div class="player"><span class="swatch b"></span><div><div id="player2" class="name">Jugador B</div><div class="side">Serpiente B</div></div><div id="score2" class="points">0</div></div>
        </div>

        <div class="panel details">
          <div class="detail"><span class="label">Estado</span><span id="status" class="value">Esperando</span></div>
          <div class="detail"><span class="label">Jugada del bot</span><span id="direction" class="value">—</span></div>
          <div class="detail"><span class="label">Movimientos restantes</span><span id="remaining" class="value">—</span></div>
          <div class="detail"><span class="label">Tiempo de decisión</span><span id="decision" class="value">—</span></div>
          <div class="detail"><span class="label">Partida</span><span id="game" class="value">—</span></div>
        </div>

        <div id="winner" class="panel winner hidden"></div>
      </aside>
    </section>
  </main>

  <script>
    const board = document.getElementById('board');
    const empty = document.getElementById('empty');
    const dot = document.getElementById('dot');
    const connection = document.getElementById('connection');
    const gameTabs = document.getElementById('gameTabs');
    const games = new Map();
    let activeGameId = null;
    const labels = { up: '↑ Arriba', down: '↓ Abajo', left: '← Izquierda', right: '→ Derecha' };

    function setText(id, value, fallback = '—') {
      document.getElementById(id).textContent = value ?? fallback;
    }

    function parseBoard(raw) {
      return (raw || '').split(/\r?\n/).filter(Boolean).map(row => {
        const first = row.indexOf('|');
        const last = row.lastIndexOf('|');
        return first >= 0 && last > first ? row.slice(first + 1, last) : row;
      });
    }

    function renderBoard(raw) {
      const rows = parseBoard(raw);
      if (!rows.length) return;

      board.innerHTML = '';
      board.style.gridTemplateColumns = `repeat(${rows[0].length}, 1fr)`;

      const classes = { A: 'a-head', a: 'a-body', B: 'b-head', b: 'b-body', '*': 'food' };
      rows.forEach(row => [...row].forEach(symbol => {
        const cell = document.createElement('div');
        cell.className = `cell ${classes[symbol] || ''}`;
        cell.setAttribute('role', 'gridcell');
        board.appendChild(cell);
      }));

      empty.classList.add('hidden');
      board.classList.remove('hidden');
    }

    function render(state) {
      if (state.board) renderBoard(state.board);
      setText('player1', state.player_1, 'Jugador A');
      setText('player2', state.player_2, 'Jugador B');
      setText('score1', state.score_1 ?? 0);
      setText('score2', state.score_2 ?? 0);
      setText('remaining', state.remaining_moves);
      setText('direction', labels[state.direction] || state.direction);
      setText('decision', state.decision_ms == null ? null : `${state.decision_ms.toFixed(1)} ms`);
      setText('game', state.game_id ? state.game_id.slice(0, 8) : null);

      const finished = state.status === 'finished';
      setText('status', finished ? 'Finalizada' : state.board ? `Turno ${state.side || ''}` : 'Esperando');
      const winner = document.getElementById('winner');
      winner.textContent = state.winner ? `Ganador: ${state.winner}` : finished ? 'Partida empatada' : '';
      winner.classList.toggle('hidden', !finished);
    }

    function renderTabs() {
      gameTabs.innerHTML = '';
      const states = [...games.values()];
      const playing = states.filter(state => state.status !== 'finished').length;
      document.getElementById('gameCount').textContent = `${playing} activa${playing === 1 ? '' : 's'} / ${states.length} total`;
      gameTabs.classList.toggle('hidden', states.length === 0);

      states
        .sort((a, b) => (a.status === 'finished') - (b.status === 'finished'))
        .forEach(state => {
          const tab = document.createElement('button');
          const opponent = state.side === 'A' ? state.player_2 : state.player_1;
          tab.type = 'button';
          tab.className = `game-tab ${state.game_id === activeGameId ? 'active' : ''}`;
          tab.setAttribute('aria-pressed', state.game_id === activeGameId ? 'true' : 'false');

          const statusDot = document.createElement('span');
          statusDot.className = `game-tab-dot ${state.status === 'finished' ? 'finished' : ''}`;
          const name = document.createElement('span');
          name.className = 'game-tab-name';
          name.textContent = opponent || state.game_id.slice(0, 8);
          const score = document.createElement('span');
          score.className = 'game-tab-score';
          score.textContent = `${state.score_1 ?? 0} – ${state.score_2 ?? 0}`;
          tab.append(statusDot, name, score);
          tab.onclick = () => {
            activeGameId = state.game_id;
            renderTabs();
            render(state);
          };
          gameTabs.appendChild(tab);
        });
    }

    function updateGames(payload) {
      (payload.games || []).forEach(state => games.set(state.game_id, state));

      if (!activeGameId || !games.has(activeGameId)) {
        const active = [...games.values()].find(state => state.status !== 'finished');
        activeGameId = active?.game_id || games.keys().next().value || null;
      }

      renderTabs();
      if (activeGameId) render(games.get(activeGameId));
    }

    const events = new EventSource('/events');
    events.onopen = () => { dot.classList.add('online'); connection.textContent = 'Conectado'; };
    events.onerror = () => { dot.classList.remove('online'); connection.textContent = 'Reconectando…'; };
    events.onmessage = event => updateGames(JSON.parse(event.data));
  </script>
</body>
</html>
